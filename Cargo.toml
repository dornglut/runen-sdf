[package]
name = "runen-sdf"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Crystonix/runen-sdf"
description = "Validated signed-field mathematics and CPU queries"
publish = false

[workspace]
resolver = "3"
members = [
    "conformance/downstream",
    "xtask",
]

[dependencies]
glam = "0.31.0"
thiserror = "2.0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
