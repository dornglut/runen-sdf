[package]
name = "runen-sdf"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
license.workspace = true
repository = "https://github.com/dornglut/runen-sdf"
description = "Validated signed-field mathematics and CPU reference queries"
publish = false

[workspace]
resolver = "3"
members = [
    "conformance/downstream",
    "xtask",
]

[workspace.package]
license = "GPL-3.0-only"

[dependencies]
glam = "0.31.0"
thiserror = "2.0.18"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
