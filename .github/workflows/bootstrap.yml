name: RunenSDF Bootstrap and Validation

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runen-sdf-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Bootstrap lockfile and validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Install required Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy

      - name: Generate and commit initial lockfile when absent
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Generate standalone Cargo lockfile"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Validate repository through the maintained authority
        run: cargo validate
